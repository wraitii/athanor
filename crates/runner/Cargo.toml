[package]
name = "js-runner"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "js-runner"
path = "src/main.rs"

[features]
wgsl = ["js-engine/wgsl"]
gpu = ["js-engine/gpu"]

[dependencies]
js-engine = { path = "../engine" }
tracing-samply = "0.1.5"
tracing-subscriber = "0.3"
