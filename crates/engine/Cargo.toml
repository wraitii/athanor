[package]
name = "js-engine"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
# Cranelift is pinned to a wasmtime main commit (newer than the 0.137.1 release)
# for an upstream fix to machine-code source locations, which jitdump profiling
# relies on. Switch back to a crates.io release once one includes it.
cranelift-codegen = { git = "https://github.com/bytecodealliance/wasmtime", rev = "24d029ab2487bc2dc7eff27ed8a9d51a0385fb75", features = ["disas"] }
cranelift-frontend = { git = "https://github.com/bytecodealliance/wasmtime", rev = "24d029ab2487bc2dc7eff27ed8a9d51a0385fb75" }
cranelift-jit = { git = "https://github.com/bytecodealliance/wasmtime", rev = "24d029ab2487bc2dc7eff27ed8a9d51a0385fb75" }
cranelift-module = { git = "https://github.com/bytecodealliance/wasmtime", rev = "24d029ab2487bc2dc7eff27ed8a9d51a0385fb75" }
oxc_allocator = "=0.157.0"
oxc_ast = "=0.157.0"
oxc_ast_visit = "=0.157.0"
oxc_parser = "=0.157.0"
oxc_semantic = "=0.157.0"
oxc_span = "=0.157.0"
oxc_syntax = "=0.157.0"
serde_json = { version = "=1.0.154", features = ["preserve_order"] }
regress = "=0.12.0"
dragonbox_ecma = "=0.1.12"
num-bigint = "=0.5.1"
rustc-hash = "=2.1.3"
smallvec = "=1.16.4"
