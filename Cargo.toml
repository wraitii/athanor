[workspace]
resolver = "3"
members = ["crates/engine", "crates/runner", "crates/web"]

[workspace.package]
edition = "2024"
license = "GPL-2.0-or-later"
version = "0.1.0"

[profile.dev]
opt-level = 1
debug = "line-tables-only"

[profile.release]
debug = "line-tables-only"

[profile.web]
inherits = "release"
opt-level = "s"
debug = false
strip = true
lto = true
codegen-units = 1
panic = "abort"
